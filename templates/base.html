
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Green Haven | Plant Shop{% endblock %}</title>
</head>

<body style="margin: 0; font-family: Arial, Helvetica, sans-serif; background-color: #f7faf5; color: #26352a; line-height: 1.6;">

    {% include "navbar.html" %}

    {% if messages %}
        <div style="max-width: 1100px; margin: 20px auto; padding: 0 20px;">
            {% for message in messages %}
                <div style="background-color: #e8f1e6; color: #245c3a; padding: 12px 16px; margin-bottom: 10px; border-radius: 7px;">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 30px 22px; box-sizing: border-box; min-height: 65vh;">
        {% block content %}
        {% endblock %}
    </main>

    <footer style="background-color: #19452b; color: white; text-align: center; padding: 25px 15px;">
        <h3 style="margin: 0; color: white;">Green Haven</h3>
        <p style="margin: 5px 0;">Bring nature closer to home.</p>
        <small>&copy; {% now "Y" %} Green Haven. All rights reserved.</small>
    </footer>

</body>
</html>
